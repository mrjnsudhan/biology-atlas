<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <h1>Biology Atlas</h1>
    <span class="tagline">Explore life at every scale ✦</span>
  </div>
  <nav class="nav">
    <button data-nav="gallery"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>Gallery</button>
    <button data-nav="library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l4 15"/></svg>Library</button>
    <button data-nav="notebooks"><svg viewBox="0 0 24 24"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>Notebooks</button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</button>
  </nav>
  <div class="avatar" aria-hidden="true"></div>
</header>

<main class="layout">
  <aside class="col-left">
    <section class="panel" id="cell-types">
      <h2 class="sec" id="list-title">🌿 CELL TYPES</h2>
      <div class="cats" id="cats"></div>
      <ul id="cell-list" class="cell-list"></ul>
    </section>
    <section class="panel" id="organelles-panel">
      <h2 class="sec" id="parts-title">✦ ORGANELLES</h2>
      <ul id="organelle-list" class="organelle-list"></ul>
    </section>
  </aside>

  <section class="col-center">
    <div class="panel viewer" id="viewer">
      <canvas id="gl"></canvas>
      <div id="viewer-msg" class="viewer-msg" hidden></div>
      <div class="title-block">
        <h2 id="cell-title">Plant Cell</h2>
        <p id="cell-sub">Eukaryotic Cell</p>
        <div class="sticky">Tip: Drag to rotate<br>Scroll to zoom<br>Ctrl + drag to pan</div>
      </div>
      <div class="viewmode">
        <div class="vm-label">VIEW MODE</div>
        <div class="vm-btns" id="vm-btns">
          <button data-mode="solid" title="Solid"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg></button>
          <button data-mode="section" title="Cross-section"><svg viewBox="0 0 24 24"><path d="M12 4l9 4.5-9 4.5-9-4.5z"/><path d="M3 12.5l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/></svg></button>
          <button data-mode="xray" title="X-ray"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></button>
        </div>
        <label class="switch-row">Cross-Section <input type="checkbox" id="sw-section" class="switch"></label>
      </div>
      <div class="toolbar tl">
        <button id="b-rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/></svg>Rotate</button>
        <button id="b-isolate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/></svg>Isolate</button>
        <button id="b-hide"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9 9 0 0 1 21 12a13 13 0 0 1-3 3.8M6.2 7.3A13 13 0 0 0 3 12c2 4 5.5 6.5 9 6.5 1.3 0 2.5-.3 3.6-.9"/></svg>Hide Others</button>
        <button id="b-reset"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Reset View</button>
      </div>
      <div class="toolbar br">
        <button id="b-shot"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>Screenshot</button>
        <button id="b-export"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg>3D Export</button>
      </div>
      <div id="org-label" class="org-label" hidden></div>
    </div>

    <div class="row-bottom">
      <section class="panel" id="micro-panel">
        <h2 class="sec">MICROSCOPE VIEW <span class="info" title="Generated illustrations. Add your own images with the + tile.">ⓘ</span></h2>
        <div class="micro-row" id="micro-row"></div>
        <input type="file" id="img-input" accept="image/*" hidden>
      </section>
      <section class="panel" id="compare-panel">
        <h2 class="sec">COMPARE <span class="info" title="Pick a second cell to compare against.">ⓘ</span></h2>
        <div class="compare-row">
          <div class="cmp-card"><img id="cmp-a-img" alt=""><div><b id="cmp-a-name"></b><small id="cmp-a-sub"></small></div></div>
          <span class="vs">VS</span>
          <button class="cmp-card" id="cmp-b-btn" title="Click to change"><img id="cmp-b-img" alt=""><div><b id="cmp-b-name"></b><small id="cmp-b-sub"></small></div></button>
        </div>
        <button class="wide-btn" id="open-compare">Open Comparison View <span>›</span></button>
      </section>
    </div>
  </section>

  <aside class="col-right">
    <section class="panel" id="detail-panel"></section>
    <section class="panel" id="notes-panel"></section>
    <section class="panel" id="where-panel"></section>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-x" id="modal-x" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="items.js"></script>
<script src="app.js"></script>
</body>
</html>
